<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iceland Weather</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0e17;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
        }

        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .back-link {
            position: fixed;
            top: 1rem;
            left: 1rem;
            text-decoration: none;
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
            z-index: 1000;
            background: rgba(0,0,0,0.4);
            padding: 0.4rem 0.7rem;
            border-radius: 6px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .title-overlay {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1000;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
            background: rgba(0,0,0,0.4);
            padding: 0.4rem 0.7rem;
            border-radius: 6px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .layer-switcher {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 0.5rem;
            background: rgba(0,0,0,0.5);
            padding: 0.5rem 0.7rem;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .layer-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.6);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: inherit;
        }
        .layer-btn:hover {
            background: rgba(255,255,255,0.18);
            color: rgba(255,255,255,0.85);
        }
        .layer-btn.active {
            background: rgba(100,180,255,0.3);
            border-color: rgba(100,180,255,0.5);
            color: #fff;
        }

        .time-badge {
            position: fixed;
            bottom: 4.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.5);
            background: rgba(0,0,0,0.4);
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font-variant-numeric: tabular-nums;
            pointer-events: none;
        }

        /* Hide Leaflet controls */
        .leaflet-control-zoom { display: none !important; }

        .leaflet-control-attribution {
            font-size: 9px !important;
            background: rgba(0,0,0,0.4) !important;
            color: rgba(255,255,255,0.4) !important;
            backdrop-filter: blur(4px);
        }
        .leaflet-control-attribution a { color: rgba(255,255,255,0.5) !important; }

        @media (max-width: 500px) {
            .layer-switcher { gap: 0.3rem; padding: 0.4rem 0.5rem; }
            .layer-btn { padding: 0.35rem 0.6rem; font-size: 0.72rem; }
        }
    </style>
</head>
<body>
    <a href="/" class="back-link">&larr; home</a>
    <div class="title-overlay">Iceland Weather</div>
    <div id="map"></div>
    <div class="time-badge" id="time-badge"></div>

    <div class="layer-switcher">
        <button class="layer-btn active" data-layer="radar">Radar</button>
        <button class="layer-btn" data-layer="satellite">Satellite</button>
        <button class="layer-btn" data-layer="temp">Temperature</button>
        <button class="layer-btn" data-layer="wind">Wind</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
    (function () {
        var map = L.map('map', {
            center: [64.963, -19.021],
            zoom: 6,
            zoomControl: false,
            scrollWheelZoom: false,
            doubleClickZoom: false,
            touchZoom: false,
            boxZoom: false,
            keyboard: false,
            dragging: true,
            attributionControl: true,
            maxBounds: [[60, -32], [70, -6]],
            maxBoundsViscosity: 1.0
        });

        // Dark base tiles
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 6,
            minZoom: 6
        }).addTo(map);

        var timeBadge = document.getElementById('time-badge');

        // --- Layer definitions ---

        // RADAR (RainViewer, animated)
        var radarState = {
            layers: {},
            frames: [],
            host: '',
            active: false
        };

        function formatTime(ts) {
            var d = new Date(ts * 1000);
            return d.getUTCHours().toString().padStart(2, '0') + ':' +
                   d.getUTCMinutes().toString().padStart(2, '0') + ' UTC';
        }

        function addRadarLayer(frame) {
            if (radarState.layers[frame.path]) return radarState.layers[frame.path];
            var layer = L.tileLayer(radarState.host + frame.path + '/512/{z}/{x}/{y}/6/1_1.png', {
                opacity: 0,
                maxZoom: 6,
                zIndex: 20
            });
            layer.addTo(map);
            radarState.layers[frame.path] = layer;
            return layer;
        }

        function showLatestRadar() {
            for (var key in radarState.layers) {
                radarState.layers[key].setOpacity(0);
            }
            var latest = radarState.frames[radarState.frames.length - 1];
            if (latest) {
                addRadarLayer(latest).setOpacity(0.65);
                timeBadge.textContent = formatTime(latest.time);
            }
        }

        function hideAllRadar() {
            for (var key in radarState.layers) {
                radarState.layers[key].setOpacity(0);
            }
            timeBadge.textContent = '';
        }

        function showRadar() {
            if (radarState.frames.length > 0) {
                showLatestRadar();
            }
            radarState.active = true;
        }

        function loadRadarData() {
            fetch('https://api.rainviewer.com/public/weather-maps.json')
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    radarState.host = data.host;
                    radarState.frames = (data.radar.past || []).concat(data.radar.nowcast || []);
                    if (radarState.frames.length === 0) return;
                    // Only preload latest frame
                    var latest = radarState.frames[radarState.frames.length - 1];
                    if (latest) addRadarLayer(latest);
                    if (radarState.active) showRadar();
                })
                .catch(function (err) {
                    console.error('RainViewer error:', err);
                });
        }

        // SATELLITE (EOX Sentinel-2 cloudless)
        var satelliteLayer = L.tileLayer(
            'https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2024_3857/default/g/{z}/{y}/{x}.jpg', {
            attribution: '<a href="https://s2maps.eu">Sentinel-2 cloudless</a> by EOX',
            maxZoom: 6,
            zIndex: 15,
            opacity: 0.85
        });

        // TEMPERATURE (OpenWeatherMap free tier)
        var tempLayer = L.tileLayer(
            'https://tile.openweathermap.org/map/temp_new/{z}/{x}/{y}.png?appid=9de243494c0b295cca9337e1e96b00e2', {
            attribution: '<a href="https://openweathermap.org">OpenWeatherMap</a>',
            maxZoom: 6,
            zIndex: 15,
            opacity: 0.7
        });

        // WIND (OpenWeatherMap free tier)
        var windLayer = L.tileLayer(
            'https://tile.openweathermap.org/map/wind_new/{z}/{x}/{y}.png?appid=9de243494c0b295cca9337e1e96b00e2', {
            attribution: '<a href="https://openweathermap.org">OpenWeatherMap</a>',
            maxZoom: 6,
            zIndex: 15,
            opacity: 0.7
        });

        // --- Layer switching ---
        var overlayLayers = {
            radar: { show: showRadar, hide: hideAllRadar },
            satellite: { show: function () { satelliteLayer.addTo(map); }, hide: function () { map.removeLayer(satelliteLayer); } },
            temp: { show: function () { tempLayer.addTo(map); }, hide: function () { map.removeLayer(tempLayer); } },
            wind: { show: function () { windLayer.addTo(map); }, hide: function () { map.removeLayer(windLayer); } }
        };

        var activeLayer = 'radar';

        function switchLayer(name) {
            if (name === activeLayer) return;
            overlayLayers[activeLayer].hide();
            activeLayer = name;
            overlayLayers[activeLayer].show();
            // Update button states
            document.querySelectorAll('.layer-btn').forEach(function (btn) {
                btn.classList.toggle('active', btn.dataset.layer === name);
            });
            // Show/hide time badge
            timeBadge.style.display = name === 'radar' ? '' : 'none';
        }

        document.querySelectorAll('.layer-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                switchLayer(this.dataset.layer);
            });
        });

        // --- Init ---
        radarState.active = true;
        loadRadarData();
        setInterval(loadRadarData, 5 * 60 * 1000);
    })();
    </script>
</body>
</html>
